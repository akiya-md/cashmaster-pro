<script>
    // --- CONFIGURATION ---
    const firebaseConfig = {
        apiKey: "AIzaSyAyShizj4G0g7z2CCHDLbetOWuJwaimcBM",
        authDomain: "cash-master-pro-b5b5a.firebaseapp.com",
        databaseURL: "https://cash-master-pro-b5b5a-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "cash-master-pro-b5b5a",
        storageBucket: "cash-master-pro-b5b5a.firebasestorage.app",
        messagingSenderId: "519363752399",
        appId: "1:519363752399:web:c99a8c837db5d4b20de2ba"
    };
    
    // Adsterra Direct Link
    const MY_AD_LINK = "https://www.profitablecpmratenetwork.com/uexqc584a?key=28c12fe7922658807bfc71689c8f3f07";

    // --- INITIALIZE ---
    // මචං, මෙතන තමයි වැරැද්ද තිබ්බේ. දැන් මේක Fix කරලා තියෙන්නේ.
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const rtdb = firebase.database();

    let currentUser = null;

    // Login Function - Pop-up වෙනුවට Redirect පාවිච්චි කරමු එතකොට Block වෙන්නේ නැහැ.
    function googleLogin() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(error => {
            console.error("Login Error:", error);
            alert("Login Error: " + error.message);
        });
    }

    auth.onAuthStateChanged(user => {
        if (user) {
            setupUser(user);
        } else {
            document.getElementById('login-area').style.display = 'flex';
            document.getElementById('user-area').style.display = 'none';
        }
    });

    async function setupUser(user) {
        currentUser = user;
        document.getElementById('login-area').style.display = 'none';
        document.getElementById('user-area').style.display = 'block';

        const userRef = db.collection("users").doc(user.uid);
        const doc = await userRef.get();

        if (!doc.exists()) {
            await userRef.set({
                name: user.displayName,
                balance: 0,
                joined: Date.now(),
                bank: ""
            });
        }
        updateUI();
        loadChat();
    }

    async function updateUI() {
        const userRef = db.collection("users").doc(currentUser.uid);
        
        // ලයිව් අප්ඩේට් වෙන්න Listener එකක් දැම්මා
        userRef.onSnapshot(doc => {
            const data = doc.data();
            if(data) {
                document.getElementById('balance').innerText = data.balance.toFixed(2);
                const daysJoined = Math.floor((Date.now() - data.joined) / (1000 * 60 * 60 * 24));
                document.getElementById('join-date').innerText = `සාමාජිකත්වය ලබාගෙන දින: ${daysJoined}`;

                if (daysJoined >= 21 && data.balance >= 5000) {
                    const wBtn = document.getElementById('withdraw-btn');
                    wBtn.disabled = false;
                    wBtn.style.opacity = "1";
                    wBtn.style.background = "#10b981";
                    wBtn.innerText = "දැන්ම මුදල් ලබාගන්න";
                }
                document.getElementById('acc-status').innerText = daysJoined < 21 ? "Status: Verification Period" : "Status: Active Earner";
            }
        });
    }

    function startEarning() {
        document.getElementById('main-earn-btn').style.display = 'none';
        document.getElementById('timer-text').style.display = 'block';
        let sec = 40;
        
        let layerCount = 0;
        const injector = setInterval(() => {
            if (layerCount < 30) {
                const ifrm = document.createElement("iframe");
                ifrm.src = MY_AD_LINK + "&cb=" + Math.random();
                document.getElementById('ad-container').appendChild(ifrm);
                layerCount++;
            }
        }, 1000);

        const timer = setInterval(() => {
            sec--;
            document.getElementById('sec').innerText = sec;
            if (sec <= 0) {
                clearInterval(timer);
                clearInterval(injector);
                addMoney();
            }
        }, 1000);
    }

    async function addMoney() {
        const userRef = db.collection("users").doc(currentUser.uid);
        await userRef.update({ 
            balance: firebase.firestore.FieldValue.increment(5.00) 
        });
        alert("සුභ පැතුම්! රු. 05.00 ක් ඔබගේ ගිණුමට එකතු විය.");
        document.getElementById('main-earn-btn').style.display = 'block';
        document.getElementById('timer-text').style.display = 'none';
        document.getElementById('ad-container').innerHTML = ""; // Ad layers clean කරනවා
    }

    function sendMessage() {
        const msgInput = document.getElementById('chat-input');
        const msg = msgInput.value;
        if (!msg || !currentUser) return;
        
        rtdb.ref('chats').push({
            name: currentUser.displayName,
            text: msg,
            time: Date.now()
        });
        msgInput.value = "";
    }

    function loadChat() {
        rtdb.ref('chats').limitToLast(20).on('value', snap => {
            const box = document.getElementById('messages');
            box.innerHTML = "";
            snap.forEach(child => {
                const val = child.val();
                box.innerHTML += `<div class="msg"><b>${val.name}:</b> ${val.text}</div>`;
            });
            box.scrollTop = box.scrollHeight;
        });
    }
</script>
