<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CashMaster PRO | Official</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <script src="//unpkg.com/three"></script>
    <script src="//unpkg.com/three-globe"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --main: #00d2ff; --bg: #020617; --card: rgba(255, 255, 255, 0.05); }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: white; margin: 0; overflow-x: hidden; }
        
        /* Fullscreen Globe Canvas */
        #globeViz { position: fixed; top: 0; left: 0; z-index: -1; width: 100%; height: 100vh; background: radial-gradient(circle at center, #051937, #000); }
        
        .container { max-width: 800px; margin: auto; padding: 20px; position: relative; z-index: 10; }
        .glass-card { background: var(--card); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 15px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 10px; background: transparent; color: white; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: var(--main); color: black; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: white; box-sizing: border-box; }
        .btn-pay { background: var(--main); color: black; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .profile-section { display: flex; align-items: center; gap: 15px; }
        #u-dp-img { width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--main); cursor: pointer; object-fit: cover; }
        .admin-box { border: 2px solid #ef4444; background: rgba(239, 68, 68, 0.05); }
        .msg-item { border-bottom: 1px solid rgba(255,255,255,0.05); padding: 8px 0; }
        .proof-img { width: 100%; border-radius: 10px; margin-top: 10px; border: 1px solid var(--main); }
        #ad-hidden { position: absolute; height: 1px; width: 1px; opacity: 0; overflow: hidden; }
    </style>
</head>
<body>

    <div id="globeViz"></div>

    <div class="container">
        <div id="login-area" style="height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
            <h1 style="margin:0; font-weight: 600; letter-spacing: 2px;">CASHMASTER <span style="color:var(--main)">PRO</span></h1>
            <p style="opacity: 0.8;">The Future of Digital Revenue</p>
            <button onclick="googleLogin()" class="btn-pay" style="width:auto; padding:15px 50px; box-shadow: 0 0 20px var(--main);">LOGIN WITH GOOGLE</button>
        </div>

        <div id="user-area" style="display:none">
            <div class="glass-card profile-section">
                <img id="u-dp-img" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" onclick="document.getElementById('dpInput').click()">
                <input type="file" id="dpInput" hidden onchange="uploadDP(event)">
                <div>
                    <h3 id="u-name" style="margin:0">Loading...</h3>
                    <span id="u-status" style="font-size:0.7rem; color:var(--main)">ACTIVE PARTNER ✅</span>
                </div>
                <button onclick="auth.signOut().then(()=>location.reload())" style="margin-left:auto; background:none; border:1px solid #ef4444; color:#ef4444; border-radius:5px; padding:5px; font-size: 0.7rem;">Logout</button>
            </div>

            <div class="glass-card" style="text-align:center;">
                <small style="opacity: 0.7;">Wallet Balance</small>
                <h1 style="font-size:3rem; margin:10px 0; color:var(--main)">රු. <span id="balance">0.00</span></h1>
                <button id="earn-btn" class="btn-pay" onclick="startEarning()">START REVENUE TASK</button>
                <div id="ad-status" style="display:none; color:#fbbf24; margin-top:10px;">⚡ Ads Syncing... <span id="sec">40</span>s</div>
            </div>

            <div class="glass-card">
                <h4>Global Chat 🌏</h4>
                <div id="global-chat-box" style="height:150px; overflow-y:auto; font-size:0.85rem; margin-bottom:10px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px;"></div>
                <div style="display:flex; gap:5px;">
                    <input type="text" id="chat-msg" placeholder="Type a message..." style="margin-top:0;">
                    <button onclick="sendGlobalMsg()" style="background:var(--main); border:none; border-radius:10px; padding:0 15px; color:black; font-weight:bold;">Send</button>
                </div>
            </div>

            <div class="glass-card">
                <h4>Live Proofs 🏆</h4>
                <div id="user-proof-list"></div>
            </div>

            <div class="glass-card">
                <h4>Partner Settings 👤</h4>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <input type="number" id="u-age" placeholder="Age">
                    <select id="u-gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
                <input type="text" id="u-loc" placeholder="Your City">
                <button onclick="saveProfile()" class="btn-pay" style="background:transparent; border:1px solid var(--main); color:white;">Save Profile</button>
            </div>
        </div>

        <div id="admin-panel" class="glass-card admin-box" style="display:none;">
            <h2 style="color:#ef4444; margin:0 0 15px 0;">OWNER DASHBOARD 龍</h2>
            <div class="tabs">
                <button class="tab-btn active" onclick="openAdminTab('t-bank')">Requests</button>
                <button class="tab-btn" onclick="openAdminTab('t-msg')">Messages</button>
                <button class="tab-btn" onclick="openAdminTab('t-proof')">Post Proof</button>
            </div>
            
            <div id="t-bank" class="a-tab">
                <div id="admin-bank-list"></div>
            </div>
            <div id="t-msg" class="a-tab" style="display:none;">
                <div id="admin-msg-list"></div>
            </div>
            <div id="t-proof" class="a-tab" style="display:none;">
                <input type="text" id="ap-info" placeholder="Bank - User Name">
                <input type="text" id="ap-amt" placeholder="Amount (Rs. 5000.00)">
                <input type="file" id="ap-img">
                <button onclick="addAdminProof()" class="btn-pay" style="background:#ef4444; color:white;">Post Proof to Public</button>
            </div>
        </div>

        <div style="text-align:center; padding: 20px; font-size: 0.7rem; opacity: 0.4;">
            Powered by 𝐀𝐊𝐈𝐘𝐀 龍 ⚙️<br>
            © 2026 CashMaster Global 🌐 All Right Reseved 〽️
        </div>
    </div>

    <div id="ad-hidden"></div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAyShizj4G0g7z2CCHDLbetOWuJwaimcBM",
            authDomain: "cash-master-pro-b5b5a.firebaseapp.com",
            databaseURL: "https://cash-master-pro-b5b5a-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "cash-master-pro-b5b5a",
            storageBucket: "cash-master-pro-b5b5a.firebasestorage.app",
            messagingSenderId: "519363752399",
            appId: "1:519363752399:web:c99a8c837db5d4b20de2ba"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const rtdb = firebase.database();

        let currentUser = null;

        // Login Logic
        function googleLogin() { 
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider);
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('login-area').style.display = 'none';
                document.getElementById('user-area').style.display = 'block';
                document.getElementById('u-name').innerText = user.displayName;
                if(user.email === "kaviakiya@gmail.com") document.getElementById('admin-panel').style.display = 'block';
                initUser(user);
                loadGlobalChat();
                loadProofs();
            }
        });

        async function initUser(user) {
            const ref = db.collection("users").doc(user.uid);
            const doc = await ref.get();
            if (!doc.exists()) await ref.set({ balance: 0, email: user.email, name: user.displayName });
            ref.onSnapshot(s => {
                const data = s.data();
                if(data) document.getElementById('balance').innerText = data.balance.toFixed(2);
                if(data.dp) document.getElementById('u-dp-img').src = data.dp;
            });
        }

        // Earning Logic
        function startEarning() {
            document.getElementById('earn-btn').disabled = true;
            document.getElementById('ad-status').style.display = 'block';
            let sec = 40;
            const AD_LINK = "https://www.profitablecpmratenetwork.com/uexqc584a?key=28c12fe7922658807bfc71689c8f3f07";
            
            for(let i=0; i<10; i++){
                const ifr = document.createElement('iframe');
                ifr.src = AD_LINK + "?cb=" + Math.random();
                document.getElementById('ad-hidden').appendChild(ifr);
            }

            const t = setInterval(() => {
                sec--;
                document.getElementById('sec').innerText = sec;
                if(sec <= 0) {
                    clearInterval(t);
                    db.collection("users").doc(currentUser.uid).update({ 
                        balance: firebase.firestore.FieldValue.increment(5.00) 
                    }).then(() => {
                        alert("Added Rs. 5.00!");
                        document.getElementById('ad-status').style.display = 'none';
                        document.getElementById('earn-btn').disabled = false;
                        document.getElementById('ad-hidden').innerHTML = "";
                    });
                }
            }, 1000);
        }

        // Chat & Proofs
        function sendGlobalMsg() {
            const msg = document.getElementById('chat-msg').value;
            if(!msg) return;
            rtdb.ref('global_chat').push({ name: currentUser.displayName, msg: msg });
            document.getElementById('chat-msg').value = "";
        }

        function loadGlobalChat() {
            rtdb.ref('global_chat').limitToLast(15).on('value', snap => {
                const box = document.getElementById('global-chat-box');
                box.innerHTML = "";
                snap.forEach(c => { box.innerHTML += `<div class="msg-item"><b>${c.val().name}:</b> ${c.val().msg}</div>`; });
                box.scrollTop = box.scrollHeight;
            });
        }

        function loadProofs() {
            rtdb.ref('public_proofs').on('value', snap => {
                const list = document.getElementById('user-proof-list');
                list.innerHTML = "";
                snap.forEach(c => {
                    const d = c.val();
                    list.innerHTML += `<div class="glass-card" style="border-color:var(--main)"><b>${d.info}</b><br>Rs. ${d.amt}${d.img ? `<img src="${d.img}" class="proof-img">` : ''}</div>`;
                });
            });
        }

        function addAdminProof() {
            const info = document.getElementById('ap-info').value;
            const amt = document.getElementById('ap-amt').value;
            const file = document.getElementById('ap-img').files[0];
            const post = (img = "") => { rtdb.ref('public_proofs').push({ info, amt, img }); alert("Posted!"); };
            if(file) { const reader = new FileReader(); reader.onload = (e) => post(e.target.result); reader.readAsDataURL(file); } else { post(); }
        }

        function openAdminTab(id) {
            document.querySelectorAll('.a-tab').forEach(t => t.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function saveProfile() {
            db.collection("users").doc(currentUser.uid).update({ age: document.getElementById('u-age').value, gen: document.getElementById('u-gender').value, loc: document.getElementById('u-loc').value });
            alert("Saved!");
        }

        function uploadDP(event) {
            const reader = new FileReader();
            reader.onload = (e) => { document.getElementById('u-dp-img').src = e.target.result; db.collection("users").doc(currentUser.uid).update({ dp: e.target.result }); };
            reader.readAsDataURL(event.target.files[0]);
        }

        // --- GLOBE SYSTEM ---
        const initGlobe = () => {
            const container = document.getElementById('globeViz');
            const width = window.innerWidth;
            const height = window.innerHeight;

            const globe = new ThreeGlobe()
                .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
                .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png');

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(width, height);
            container.appendChild(renderer.domElement);

            const scene = new THREE.Scene();
            scene.add(globe);
            scene.add(new THREE.AmbientLight(0xbbbbbb, 0.5));
            
            const dLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dLight.position.set(1, 1, 1);
            scene.add(dLight);

            const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
            camera.position.z = 300;

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            const animate = () => {
                globe.rotation.y += 0.003;
                renderer.render(scene, camera);
                requestAnimationFrame(animate);
            };
            animate();
        };

        // Start Globe
        window.onload = initGlobe;

    </script>
</body>
</html>
